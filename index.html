    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      font-family: 'Plus Jakarta Sans', sans-serif;

    h1, h2, h3, .hero-title, .brand-box h2 {

    body {

      color: #0f172a;

    }
    .portal-layout {

    }
    .sidebar {
      width: 280px;
      background: #0f172a;
      color: white;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      border-right: 1px solid rgba(255,255,255,0.05);
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;

      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #38bdf8, #34d399);
      -webkit-background-clip: text;

      color: #94a3b8;

      color: #94a3b8;
      border: none;
      border-radius: 10px;
      padding: 12px 16px;

      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;

      color: #0f172a;

    @media (max-width: 900px) {

      .sidebar { width: 100%; height: auto; position: static; }
      .topbar { flex-direction: column; align-items: flex-start; gap: 16px; padding: 20px 24px; }
      .content { padding: 20px; }
      .landing-contact-banner { flex-direction: column; align-items: flex-start; }

    const sanitizeUrl = (url) => {
      if (!url) return '';
      const trimmed = url.trim();
      if (trimmed.toLowerCase().startsWith('javascript:') || trimmed.toLowerCase().startsWith('data:')) {
        return '#';
      }
      return trimmed;
    };

    // Helper functions for safe base64 UTF-8 conversion in browser
    const encodeBase64Utf8 = (str) => {
      const bytes = new TextEncoder().encode(str);
      let binary = '';
      const len = bytes.byteLength;
      for (let i = 0; i < len; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary);
    };

    const decodeBase64Utf8 = (base64) => {
      const binaryString = atob(base64.replace(/\s/g, ''));
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return new TextDecoder().decode(bytes);
    };

    const replaceSection = (text, start, end, replacement) => {
      const startIdx = text.indexOf(start);
      const endIdx = text.indexOf(end, startIdx);
      if (startIdx === -1 || endIdx === -1) {
        throw new Error(`Markers not found in HTML source structure: ${start} to ${end}`);
      }
      return text.substring(0, startIdx + start.length) + "\n" + replacement + "\n" + text.substring(endIdx);
    };

    const CUSATPortal = () => {
      const [userRole, setUserRole] = React.useState('user');
      const [showAuthModal, setShowAuthModal] = React.useState(false);
      
      // Git Auth Creds (In-Memory/Session)
      const [gitOwner, setGitOwner] = React.useState(() => sessionStorage.getItem('git_owner') || '');
      const [gitRepo, setGitRepo] = React.useState(() => sessionStorage.getItem('git_repo') || '');
      const [gitPat, setGitPat] = React.useState(() => sessionStorage.getItem('git_pat') || '');
      
      const [activeModule, setActiveModule] = React.useState('home');
      const [adminSection, setAdminSection] = React.useState('calendar');

      // Local React States representing current data
      const [academicEvents, setAcademicEvents] = React.useState(defaultEvents);
      const [hostels, setHostels] = React.useState(defaultHostels);
      const [pgs, setPgs] = React.useState(defaultPGs);
      const [foodSpots, setFoodSpots] = React.useState(defaultFoodSpots);
      const [restaurants, setRestaurants] = React.useState(defaultRestaurants);
      const [amenities, setAmenities] = React.useState(defaultAmenities);
      const [clubs, setClubs] = React.useState(defaultClubs);

      // Add/Edit Form States
      const [newEvent, setNewEvent] = React.useState({ title: '', date: '', type: 'academic' });
      const [newHostel, setNewHostel] = React.useState({ name: '', location: '', fees: '', food: '', contact: '', rooms: '', gmapsLink: '' });
      const [newPG, setNewPG] = React.useState({ name: '', location: '', rent: '', food: '', contact: '', rooms: '', gmapsLink: '' });
      const [newFoodSpot, setNewFoodSpot] = React.useState({ name: '', location: '', specialty: '', timing: '', gmapsLink: '' });
      const [newRestaurant, setNewRestaurant] = React.useState({ name: '', location: '', cuisine: '', contact: '', gmapsLink: '' });
      const [newAmenity, setNewAmenity] = React.useState({ name: '', location: '', details: '', gmapsLink: '' });
      const [newClub, setNewClub] = React.useState({ name: '', location: '', contact: '', services: '', gmapsLink: '' });

      const [editIndex, setEditIndex] = React.useState(null);
      const [unsavedChanges, setUnsavedChanges] = React.useState(false);
      
      // Git Publishing API States
      const [isPublishing, setIsPublishing] = React.useState(false);
      const [publishingStatus, setPublishingStatus] = React.useState('');

      // Search and Filter States
      const [hostelSearch, setHostelSearch] = React.useState('');
      const [pgSearch, setPgSearch] = React.useState('');
      const [pgFoodFilter, setPgFoodFilter] = React.useState('all');
      const [pgRentFilter, setPgRentFilter] = React.useState('all');
      const [foodSearch, setFoodSearch] = React.useState('');
      const [restaurantSearch, setRestaurantSearch] = React.useState('');
      const [restaurantCuisineFilter, setRestaurantCuisineFilter] = React.useState('all');
      const [amenitySearch, setAmenitySearch] = React.useState('');
      const [clubSearch, setClubSearch] = React.useState('');

      // Auto-login on mount if session data is present
      React.useEffect(() => {
        if (gitOwner && gitRepo && gitPat) {
          setUserRole('admin');
        }
      }, []);

      const contacts = {
        hostelOffice: {
          name: 'CUSAT Hostel Office',
          phone: '+91-484-2576817',
          email: 'hostels@cusat.ac.in',
          address: 'Hostel Complex, CUSAT, Kalamassery, Kochi'
        },
        adminOffice: {
          name: 'CUSAT Administration Office',
          phone: '+91-484-2576800',
          email: 'admin@cusat.ac.in',
          address: 'Administrative Building, CUSAT, Kalamassery, Kochi'
        }
      };

      const handleLogin = async (e) => {
        e.preventDefault();

        if (!gitOwner.trim() || !gitRepo.trim() || !gitPat.trim()) {
          alert('Please fill out all credentials.');
          return;
        }

        setIsPublishing(true);
        setPublishingStatus('Verifying access token with GitHub API...');

        try {
          const res = await fetch(`https://api.github.com/repos/${gitOwner.trim()}/${gitRepo.trim()}/contents/index.html`, {
            headers: {
              'Authorization': `token ${gitPat.trim()}`,
              'Accept': 'application/vnd.github.v3+json'
            }
          });

          if (!res.ok) {
            throw new Error(`GitHub responded with status: ${res.status}`);
          }

          // Save credentials in session storage for refreshing
          sessionStorage.setItem('git_owner', gitOwner.trim());
          sessionStorage.setItem('git_repo', gitRepo.trim());
          sessionStorage.setItem('git_pat', gitPat.trim());

          setUserRole('admin');
          setShowAuthModal(false);
          alert('Authenticated successfully! Admin Access unlocked.');
        } catch (err) {
          alert(`Authentication failed: ${err.message}. Please check your credentials and token permissions.`);
        } finally {
          setIsPublishing(false);
          setPublishingStatus('');
        }
      };

      const logout = () => {
        sessionStorage.clear();
        setGitOwner('');
        setGitRepo('');
        setGitPat('');
        setUserRole('user');
        setActiveModule('home');
        setUnsavedChanges(false);
        alert('Logged out. Admin session cleared.');
      };

      const publishToGitHub = async () => {
        if (!gitOwner || !gitRepo || !gitPat) {
          alert('Missing GitHub credentials. Please re-login.');
          logout();
          return;
        }

        setIsPublishing(true);
        setPublishingStatus('Fetching latest file content from GitHub...');

        try {
          // 1. Fetch current index.html content & SHA to avoid overwriting newer commits
          const fetchUrl = `https://api.github.com/repos/${gitOwner}/${gitRepo}/contents/index.html`;
          const getRes = await fetch(fetchUrl, {
            headers: {
              'Authorization': `token ${gitPat}`,
              'Accept': 'application/vnd.github.v3+json',
              'Cache-Control': 'no-cache'
            }
          });

          if (!getRes.ok) {
            throw new Error(`Could not fetch index.html from repository: ${getRes.statusText}`);
          }

          const gitFile = await getRes.json();
          const fileSha = gitFile.sha;
          const htmlContent = decodeBase64Utf8(gitFile.content);

          setPublishingStatus('Formatting updated data and updating source code...');

          // 2. Perform text replacements using markers
          let updatedHtml = htmlContent;
          updatedHtml = replaceSection(updatedHtml, '// <!--EVENTS_START-->', '// <!--EVENTS_END-->', `    const defaultEvents = ${JSON.stringify(academicEvents, null, 2)};`);
          updatedHtml = replaceSection(updatedHtml, '// <!--HOSTELS_START-->', '// <!--HOSTELS_END-->', `    const defaultHostels = ${JSON.stringify(hostels, null, 2)};`);
          updatedHtml = replaceSection(updatedHtml, '// <!--PGS_START-->', '// <!--PGS_END-->', `    const defaultPGs = ${JSON.stringify(pgs, null, 2)};`);
          updatedHtml = replaceSection(updatedHtml, '// <!--FOODSPOTS_START-->', '// <!--FOODSPOTS_END-->', `    const defaultFoodSpots = ${JSON.stringify(foodSpots, null, 2)};`);
          updatedHtml = replaceSection(updatedHtml, '// <!--RESTAURANTS_START-->', '// <!--RESTAURANTS_END-->', `    const defaultRestaurants = ${JSON.stringify(restaurants, null, 2)};`);
          updatedHtml = replaceSection(updatedHtml, '// <!--AMENITIES_START-->', '// <!--AMENITIES_END-->', `    const defaultAmenities = ${JSON.stringify(amenities, null, 2)};`);
          updatedHtml = replaceSection(updatedHtml, '// <!--CLUBS_START-->', '// <!--CLUBS_END-->', `    const defaultClubs = ${JSON.stringify(clubs, null, 2)};`);

          setPublishingStatus('Submitting commit to GitHub...');

          // 3. Encode to base64
          const base64Content = encodeBase64Utf8(updatedHtml);

          // 4. PUT updated file to GitHub
          const putRes = await fetch(fetchUrl, {
            method: 'PUT',
            headers: {
              'Authorization': `token ${gitPat}`,
              'Content-Type': 'application/json',
              'Accept': 'application/vnd.github.v3+json'
            },
            body: JSON.stringify({
              message: 'Update campus listings via Admin Portal UI',
              content: base64Content,
              sha: fileSha
            })
          });

          if (!putRes.ok) {
            const errDetails = await putRes.json();
            throw new Error(`GitHub Commit Rejected: ${errDetails.message || putRes.statusText}`);
          }

          setUnsavedChanges(false);
          alert('Success! Changes committed to your repository. GitHub Pages will build and deploy the update in 1-2 minutes.');
        } catch (err) {
          alert(`Publishing failed: ${err.message}`);
        } finally {
          setIsPublishing(false);
          setPublishingStatus('');
        }
      };

      const resetFormByType = (type) => {
        if (type === 'calendar') setNewEvent({ title: '', date: '', type: 'academic' });
        if (type === 'hostels') setNewHostel({ name: '', location: '', fees: '', food: '', contact: '', rooms: '', gmapsLink: '' });
        if (type === 'pgs') setNewPG({ name: '', location: '', rent: '', food: '', contact: '', rooms: '', gmapsLink: '' });
        if (type === 'food') setNewFoodSpot({ name: '', location: '', specialty: '', timing: '', gmapsLink: '' });
        if (type === 'restaurants') setNewRestaurant({ name: '', location: '', cuisine: '', contact: '', gmapsLink: '' });
        if (type === 'amenities') setNewAmenity({ name: '', location: '', details: '', gmapsLink: '' });
        if (type === 'clubs') setNewClub({ name: '', location: '', contact: '', services: '', gmapsLink: '' });
      };

      const addOrUpdateItem = (type) => {
        const config = {
          calendar: { value: newEvent, setValue: setNewEvent, list: academicEvents, setList: setAcademicEvents, required: ['title', 'date'] },
          hostels: { value: newHostel, setValue: setNewHostel, list: hostels, setList: setHostels, required: ['name', 'location', 'contact'] },
          pgs: { value: newPG, setValue: setNewPG, list: pgs, setList: setPgs, required: ['name', 'location', 'contact'] },
          food: { value: newFoodSpot, setValue: setNewFoodSpot, list: foodSpots, setList: setFoodSpots, required: ['name', 'location'] },
          restaurants: { value: newRestaurant, setValue: setNewRestaurant, list: restaurants, setList: setRestaurants, required: ['name', 'location'] },
          amenities: { value: newAmenity, setValue: setNewAmenity, list: amenities, setList: setAmenities, required: ['name', 'location'] },
          clubs: { value: newClub, setValue: setNewClub, list: clubs, setList: setClubs, required: ['name', 'location'] }
        };

        const current = config[type];
        const hasAll = current.required.every(field => current.value[field] && current.value[field].toString().trim() !== '');
        
        if (!hasAll) {
          alert('Please fill out all required fields.');
          return;
        }

        if (editIndex !== null) {
          const updated = current.list.map((item, idx) => idx === editIndex ? current.value : item);
          current.setList(updated);
        } else {
          current.setList([...current.list, current.value]);
        }

        resetFormByType(type);
        setEditIndex(null);
        setUnsavedChanges(true);
      };

      const handleEdit = (type, index, item) => {
        setAdminSection(type);
        setEditIndex(index);
        if (type === 'calendar') setNewEvent(item);
        if (type === 'hostels') setNewHostel(item);
        if (type === 'pgs') setNewPG(item);
        if (type === 'food') setNewFoodSpot(item);
        if (type === 'restaurants') setNewRestaurant(item);
        if (type === 'amenities') setNewAmenity(item);
        if (type === 'clubs') setNewClub(item);
      };

      const handleDelete = (setter, list, index) => {
        setter(list.filter((_, i) => i !== index));
        setUnsavedChanges(true);
        if (editIndex === index) setEditIndex(null);
      };

      const cancelEdit = (type) => {
        setEditIndex(null);
        resetFormByType(type);
      };

      const menuItems = [
        { id: 'home', label: 'Home', icon: 'ti-home' },
        { id: 'calendar', label: 'Academic Calendar', icon: 'ti-calendar' },
        { id: 'contacts', label: 'Contacts', icon: 'ti-phone' },
        { id: 'hostels', label: 'Hostels', icon: 'ti-building-community' },
        { id: 'pgs', label: 'PGs', icon: 'ti-bed' },
        { id: 'food', label: 'Tea Spots', icon: 'ti-coffee' },
        { id: 'restaurants', label: 'Restaurants', icon: 'ti-tools-kitchen-2' },
        { id: 'amenities', label: 'Amenities', icon: 'ti-map-pin' },
        { id: 'clubs', label: 'Campus Clubs', icon: 'ti-users' },
        ...(userRole === 'admin' ? [{ id: 'admin', label: 'Admin Panel', icon: 'ti-settings' }] : [])
      ];

      const contains = (value, search) => (value || '').toLowerCase().includes(search.toLowerCase());

      const filteredHostels = hostels.filter(item =>
        contains(item.name, hostelSearch) ||
        contains(item.location, hostelSearch) ||
        contains(item.food, hostelSearch)
      );

      const parseRent = (rent) => {
        const num = parseInt((rent || '').toString().replace(/[^\d]/g, ''), 10);
        return isNaN(num) ? null : num;
      };

      const filteredPGs = pgs.filter(item => {
        const textMatch =
          contains(item.name, pgSearch) ||
          contains(item.location, pgSearch) ||
          contains(item.food, pgSearch) ||
          contains(item.rooms, pgSearch);

        const foodMatch =
          pgFoodFilter === 'all' ? true :
          pgFoodFilter === 'included' ? contains(item.food, 'included') || contains(item.food, 'mess') :
          pgFoodFilter === 'not-included' ? !contains(item.food, 'included') && !contains(item.food, 'mess') :
          true;

        const rent = parseRent(item.rent);
        const rentMatch =
          pgRentFilter === 'all' ? true :
          pgRentFilter === 'below6000' ? rent !== null && rent < 6000 :
          pgRentFilter === '6000to8000' ? rent !== null && rent >= 6000 && rent <= 8000 :
          pgRentFilter === 'above8000' ? rent !== null && rent > 8000 :
          true;

        return textMatch && foodMatch && rentMatch;
      });

      const filteredFoodSpots = foodSpots.filter(item =>
        contains(item.name, foodSearch) ||
        contains(item.location, foodSearch) ||
        contains(item.specialty, foodSearch)
      );

      const filteredRestaurants = restaurants.filter(item => {
        const textMatch =
          contains(item.name, restaurantSearch) ||
          contains(item.location, restaurantSearch) ||
          contains(item.cuisine, restaurantSearch);

        const cuisineMatch =
          restaurantCuisineFilter === 'all' ? true :
          contains(item.cuisine, restaurantCuisineFilter);

        return textMatch && cuisineMatch;
      });

      const filteredAmenities = amenities.filter(item =>
        contains(item.name, amenitySearch) ||
        contains(item.location, amenitySearch) ||
        contains(item.details, amenitySearch)
      );

      const filteredClubs = clubs.filter(item =>
        contains(item.name, clubSearch) ||
        contains(item.location, clubSearch) ||
        contains(item.services, clubSearch)
      );

      const FIELD_LABELS = {
        location: 'Location',
        fees: 'Fees',
        food: 'Food / Mess',
        contact: 'Contact Info',
        rooms: 'Room Type',
        rent: 'Rent',
        specialty: 'Specialty',
        timing: 'Timing',
        cuisine: 'Cuisine',
        details: 'Details',
        services: 'Services Provided'
      };

      const renderCards = (items, fields) => (
        <div className="grid">
          {items.length ? items.map((item, idx) => {
            const mapsQuery = encodeURIComponent(`${item.name || item.title} ${item.location || ''} CUSAT Kalamassery Kochi`);
            const mapsUrl = item.gmapsLink && item.gmapsLink.trim() !== '' ? sanitizeUrl(item.gmapsLink) : `https://www.google.com/maps/search/?api=1&query=${mapsQuery}`;
            return (
              <div className="item-card" key={idx}>
                <div>
                  <h3>{item.name || item.title}</h3>
                  {fields.map((field, i) => item[field] ? (
                    <p key={i}><strong>{FIELD_LABELS[field] || (field.charAt(0).toUpperCase() + field.slice(1))}:</strong> {item[field]}</p>
                  ) : null)}
                </div>
                {item.location && (
                  <a href={mapsUrl} target="_blank" rel="noopener noreferrer" className="maps-btn">
                    <i className="ti ti-map-2"></i> Navigate on Maps
                  </a>
                )}
              </div>
            );
          }) : <p>No matching results found.</p>}
        </div>
      );

      return (
        <div className="portal-layout">
          <aside className="sidebar">
            <div className="brand-box">
              <h2>CUSAT</h2>
              <p>Kochi Student Utility Portal</p>
            </div>

            {userRole === 'user' ? (
              <button className="auth-btn" onClick={() => setShowAuthModal(true)}>
                <i className="ti ti-lock"></i> Admin Access
              </button>
            ) : (
              <button className="auth-btn logout" onClick={logout}>
                <i className="ti ti-logout"></i> Exit Admin
              </button>
            )}

            <div className="menu-list">
              {menuItems.map(item => (
                <button
                  key={item.id}
                  className={`menu-btn ${activeModule === item.id ? 'active' : ''}`}
                  onClick={() => setActiveModule(item.id)}
                >
                  <i className={`ti ${item.icon}`}></i>
                  {item.label}
                </button>
              ))}
            </div>
          </aside>

          <div className="main-area">
            <div className="topbar">
              <div>
                <h1>CUSAT Smart Student Portal</h1>
                <p>Kalamassery, Kochi - campus support, accommodation and nearby essentials</p>
              </div>
              <div className="status-box">
                <span className={`status-badge ${userRole}`}>
                  <i className={`ti ${userRole === 'admin' ? 'ti-shield-check' : 'ti-eye'}`}></i>
                  {userRole === 'admin' ? 'Admin Mode (GitHub)' : 'Guest Viewer'}
                </span>
              </div>
            </div>

            <div className="content">
              {/* Publishing Loading Banner */}
              {isPublishing && (
                <div className="publish-banner" style={{ background: '#fef3c7', borderColor: '#fde68a' }}>
                  <div className="publish-banner-text" style={{ color: '#92400e' }}>
                    <i className="ti ti-loader" style={{ display: 'inline-block', animation: 'spin 1s linear infinite', marginRight: '8px' }}></i>
                    <strong>Processing:</strong> {publishingStatus}
                  </div>
                </div>
              )}

              {/* Unsaved Changes Banner */}
              {unsavedChanges && !isPublishing && (
                <div className="publish-banner">
                  <div className="publish-banner-text">
                    <i className="ti ti-alert-circle" style={{ marginRight: '8px', fontSize: '16px' }}></i>
                    <strong>Unsaved Edits:</strong> You have made changes locally. Click publish to deploy them to GitHub Pages.
                  </div>
                  <button className="btn-secondary" style={{ padding: '8px 16px', fontSize: '13px' }} onClick={publishToGitHub}>
                    <i className="ti ti-cloud-upload" style={{ marginRight: '6px' }}></i> Save & Publish
                  </button>
                </div>
              )}

              <div key={activeModule} className="fade-in-section">
              {activeModule === 'home' && (
                <div>
                  {/* Hero Section */}
                  <div className="hero-section">
                    <h2 className="hero-title">CUSAT Student Portal</h2>
                    <p className="hero-subtitle">
                      Your ultimate campus assistant for staying, dining, and navigating Kochi University. Find local hostels, PG accommodations, dining spots, and key campus contacts.
                    </p>
                    <div className="quick-stats">
                      <div className="stat-item">
                        <div className="stat-val">{academicEvents.length}</div>
                        <div className="stat-lbl">Calendar Events</div>
                      </div>
                      <div className="stat-item">
                        <div className="stat-val">{hostels.length + pgs.length}</div>
                        <div className="stat-lbl">Accommodations</div>
                      </div>
                      <div className="stat-item">
                        <div className="stat-val">{foodSpots.length + restaurants.length}</div>
                        <div className="stat-lbl">Tea & Dining</div>
                      </div>
                      <div className="stat-item">
                        <div className="stat-val">{amenities.length}</div>
                        <div className="stat-lbl">Campus Services</div>
                      </div>
                      <div className="stat-item">
                        <div className="stat-val">{clubs.length}</div>
                        <div className="stat-lbl">Clubs Active</div>
                      </div>
                    </div>
                  </div>

                  {/* Modules Preview Grid */}
                  <div className="preview-grid">
                    {/* Academic Calendar Card */}
                    <div className="preview-card" onClick={() => setActiveModule('calendar')}>
                      <div>
                        <div className="preview-header">
                          <div className="preview-icon-box">
                            <i className="ti ti-calendar"></i>
                          </div>
                          <h3 className="preview-title">Academic Calendar</h3>
                        </div>
                        <div className="preview-content">
                          Stay updated with upcoming registrations, examinations, and university holidays.
                          <ul className="preview-list-small">
                            {academicEvents.slice(0, 2).map((e, idx) => (
                              <li key={idx}>
                                <i className="ti ti-circle-chevron-right"></i>
                                <span>{e.title} ({e.date})</span>
                              </li>
                            ))}
                          </ul>
                        </div>
                      </div>
                      <button className="preview-btn-text">
                        Open Calendar <i className="ti ti-arrow-right"></i>
                      </button>
                    </div>

                    {/* Accommodation Card */}
                    <div className="preview-card" onClick={() => setActiveModule('hostels')}>
                      <div>
                        <div className="preview-header">
                          <div className="preview-icon-box">
                            <i className="ti ti-home"></i>
                          </div>
                          <h3 className="preview-title">Stays & Hostels</h3>
                        </div>
                        <div className="preview-content">
                          Browse verified university hostels and Paying Guest (PG) listings near Kalamassery.
                          <ul className="preview-list-small">
                            {hostels.slice(0, 1).map((h, idx) => (
                              <li key={idx}>
                                <i className="ti ti-building-community"></i>
                                <span>{h.name} - {h.fees}</span>
                              </li>
                            ))}
                            {pgs.slice(0, 1).map((p, idx) => (
                              <li key={idx}>
                                <i className="ti ti-bed"></i>
                                <span>{p.name} - {p.rent}</span>
                              </li>
                            ))}
                          </ul>
                        </div>
                      </div>
                      <button className="preview-btn-text" onClick={(e) => { e.stopPropagation(); setActiveModule('hostels'); }}>
                        Explore Stays <i className="ti ti-arrow-right"></i>
                      </button>
                    </div>

                    {/* Tea Spot & Restaurant Card */}
                    <div className="preview-card" onClick={() => setActiveModule('food')}>
                      <div>
                        <div className="preview-header">
                          <div className="preview-icon-box">
                            <i className="ti ti-coffee"></i>
                          </div>
                          <h3 className="preview-title">Tea Spots</h3>
                        </div>
                        <div className="preview-content">
                          Discover local tea shops, campus canteens, and snack joints around the university.
                          <ul className="preview-list-small">
                            {foodSpots.slice(0, 1).map((f, idx) => (
                              <li key={idx}>
                                <i className="ti ti-cookie"></i>
                                <span>{f.name} ({f.timing})</span>
                              </li>
                            ))}
                            {restaurants.slice(0, 1).map((r, idx) => (
                              <li key={idx}>
                                <i className="ti ti-tools-kitchen-2"></i>
                                <span>{r.name} - {r.cuisine}</span>
                              </li>
                            ))}
                          </ul>
                        </div>
                      </div>
                      <button className="preview-btn-text" onClick={(e) => { e.stopPropagation(); setActiveModule('food'); }}>
                        Explore Tea Spots <i className="ti ti-arrow-right"></i>
                      </button>
                    </div>

                    {/* Amenities Card */}
                    <div className="preview-card" onClick={() => setActiveModule('amenities')}>
                      <div>
                        <div className="preview-header">
                          <div className="preview-icon-box">
                            <i className="ti ti-map-pin"></i>
                          </div>
                          <h3 className="preview-title">Campus Amenities</h3>
                        </div>
                        <div className="preview-content">
                          Locate critical facilities like medical stores, photocopying centers, and laundry services.
                          <ul className="preview-list-small">
                            {amenities.slice(0, 2).map((a, idx) => (
                              <li key={idx}>
                                <i className="ti ti-info-circle"></i>
                                <span>{a.name} - {a.location}</span>
                              </li>
                            ))}
                          </ul>
                        </div>
                      </div>
                      <button className="preview-btn-text">
                        View Utilities <i className="ti ti-arrow-right"></i>
                      </button>
                    </div>

                    {/* Clubs Card */}
                    <div className="preview-card" onClick={() => setActiveModule('clubs')}>
                      <div>
                        <div className="preview-header">
                          <div className="preview-icon-box">
                            <i className="ti ti-users"></i>
                          </div>
                          <h3 className="preview-title">Campus Clubs</h3>
                        </div>
                        <div className="preview-content">
